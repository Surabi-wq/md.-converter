name: Android APK
on:
 push:
  branches: [main]
 pull_request:
  branches: [main]
 workflow_dispatch:
concurrency:
 group: android-apk-${{ github.ref }}
 cancel-in-progress: true
permissions:
 contents: read
jobs:
 build:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with: { distribution: temurin, java-version: '17' }
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.9' }
   - run: gradle --no-daemon :app:assembleDebug
   - name: Rename installable APK to Marka.apk
     run: |
      test -s app/build/outputs/apk/debug/app-debug.apk
      cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Marka.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Marka-1.8.0
      path: app/build/outputs/apk/debug/Marka.apk
      if-no-files-found: error
      retention-days: 14